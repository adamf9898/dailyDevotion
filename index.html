<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Devotion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Daily Devotion</h1>
        <p class="tagline">Grow in faith, one day at a time</p>
    </header>

    <main>
        <section id="devotion-container">
            <article id="devotion">
                <div class="date-display" id="current-date"></div>
                <h2 id="devotion-title">Loading...</h2>
                <blockquote id="scripture-verse">
                    <p id="verse-text"></p>
                    <cite id="verse-reference"></cite>
                </blockquote>
                <div id="devotion-content"></div>
                <div id="prayer">
                    <h3>Prayer</h3>
                    <p id="prayer-text"></p>
                </div>
            </article>
        </section>

        <nav class="devotion-nav">
            <button id="prev-btn" aria-label="Previous devotion">
                &larr; Previous
            </button>
            <button id="today-btn" aria-label="Today's devotion">
                Today
            </button>
            <button id="next-btn" aria-label="Next devotion">
                Next &rarr;
            </button>
        </nav>
    </main>

    <footer>
        <p>&copy; 2025 Daily Devotion. All rights reserved.</p>
    </footer>

    <script src="js/devotions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
